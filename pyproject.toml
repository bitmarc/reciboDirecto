[project]
name = "receipt"
version = "0.1.0"
description = "Plataforma de comprobantes de pago no fiscales"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.115,<0.116)",
    "uvicorn[standard] (>=0.34,<0.35)",
    "sqlalchemy[asyncio] (>=2.0.36,<2.1)",
    "asyncpg (>=0.30,<0.31)",
    "alembic (>=1.14,<2.0)",
    "pydantic (>=2.10,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "jinja2 (>=3.1,<4.0)",
    "python-multipart (>=0.0.20,<0.1)",
    "argon2-cffi (>=23.1,<24.0)",
    "itsdangerous (>=2.2,<3.0)",
    "email-validator (>=2.2,<3.0)",
    "azure-storage-blob (>=12.24,<13.0)",
    "weasyprint (>=63.0,<64.0)",
    "num2words (>=0.5.13,<0.6)",
]

[project.optional-dependencies]

[tool.poetry]
packages = [{ include = "receipt", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
httpx = "^0.28"
ruff = "^0.9"
mypy = "^1.14"
types-python-dateutil = "^2.9"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------
# Calidad de código
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff
    "ASYNC",
]
ignore = ["B008"]  # Depends() en argumentos por defecto es el idioma de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

# El dominio es lógica pura y es lo que sostiene las reglas de negocio:
# se exige tipado estricto. El resto de la app baja el listón.
[[tool.mypy.overrides]]
module = "receipt.domain.*"
strict = true

[[tool.mypy.overrides]]
module = ["num2words.*", "weasyprint.*", "azure.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Pruebas
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un bucle por prueba, y el motor asíncrono creado dentro de él (ver conftest).
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "db: requiere PostgreSQL real (triggers, concurrencia, restricciones)",
]
