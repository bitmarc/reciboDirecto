{% extends "base.html" %}
{% block title %}Crear cuenta — Recibo{% endblock %}

{% block content %}
<section class="card card--narrow">
  <h1>Crear cuenta</h1>
  <p class="muted">Estos datos aparecen en tus recibos. Los puedes cambiar después.</p>

  <form method="post" action="/auth/register">
    <label for="display_name">Tu nombre o el de tu negocio</label>
    <input id="display_name" name="display_name" value="{{ display_name or '' }}" required autofocus>

    <label for="occupation">Oficio <span class="muted">(opcional)</span></label>
    <input id="occupation" name="occupation" value="{{ occupation or '' }}"
           placeholder="Electricista — instalaciones residenciales">

    <label for="phone">Teléfono</label>
    <input id="phone" name="phone" type="tel" value="{{ phone or '' }}" required inputmode="tel">

    <label for="default_city">Ciudad</label>
    <input id="default_city" name="default_city" value="{{ default_city or 'Ciudad de México' }}" required>

    <hr>

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required
           autocomplete="username" inputmode="email">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required minlength="8"
           autocomplete="new-password">
    <p class="muted">Mínimo 8 caracteres.</p>

    <button type="submit" class="button button--primary">Crear cuenta</button>
  </form>

  <p class="muted">¿Ya tienes cuenta? <a href="/entrar">Entrar</a></p>
</section>
{% endblock %}
