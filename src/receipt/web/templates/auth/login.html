{% extends "base.html" %}
{% block title %}Entrar — Recibo{% endblock %}

{% block content %}
<section class="card card--narrow">
  <h1>Entrar</h1>

  <form method="post" action="/auth/login">
    <input type="hidden" name="next" value="{{ next }}">

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus
           autocomplete="username" inputmode="email">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <button type="submit" class="button button--primary">Entrar</button>
  </form>

  <p class="muted"><a href="/recuperar">Olvidé mi contraseña</a></p>
  <p class="muted">¿Primera vez? <a href="/registro">Crear una cuenta</a></p>
</section>
{% endblock %}
